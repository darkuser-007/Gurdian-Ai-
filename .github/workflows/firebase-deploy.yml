name: Guardian AI Firebase Firestore Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type DEPLOY_FIRESTORE to deploy rules and indexes to guardian-ai-db"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: guardian-ai-db-firestore-production
  cancel-in-progress: false

jobs:
  deploy-firestore:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deployment == 'DEPLOY_FIRESTORE'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: guardian-ai-db
      FIRESTORE_DATABASE_ID: (default)
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" != projects/*/locations/global/workloadIdentityPools/*/providers/* ]]; then
            echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER to the full provider resource name for guardian-ai-db."
            exit 1
          fi
          if [[ "$GCP_SERVICE_ACCOUNT" != *@guardian-ai-db.iam.gserviceaccount.com ]]; then
            echo "::error::Set GCP_SERVICE_ACCOUNT to a deployment service account in guardian-ai-db."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = JSON.parse(fs.readFileSync('firebase-applet-config.json', 'utf8'));
          const firebase = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const provider = process.env.GCP_WORKLOAD_IDENTITY_PROVIDER.trim();
          const providerProjectNumber = provider.split('/')[1];
          if (providerProjectNumber !== app.messagingSenderId) {
            console.error('The Workload Identity provider must belong to Firebase project number ' + app.messagingSenderId + '.');
            process.exit(1);
          }
          const target = firebase.firestore?.find(item => item.database === process.env.FIRESTORE_DATABASE_ID);
          if (app.projectId !== process.env.FIREBASE_PROJECT_ID || !target) {
            console.error('Firebase app config and Firestore deployment target do not match guardian-ai-db/(default).');
            process.exit(1);
          }
          if (!fs.existsSync(target.rules) || !fs.existsSync(target.indexes)) {
            console.error('Configured Firestore rules or indexes file is missing.');
            process.exit(1);
          }
          console.log('Validated Firestore target:', app.projectId, target.database);
          NODE

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: guardian-ai-db
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Verify the default Firestore database exists
        run: |
          firebase firestore:databases:get "(default)" \
            --project guardian-ai-db \
            --json

      - name: Deploy Firestore security rules and indexes
        run: |
          firebase deploy --only firestore \
            --project guardian-ai-db \
            --non-interactive
