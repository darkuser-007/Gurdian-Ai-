name: Guardian AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          console.log("Dependency vulnerability totals:", report.metadata?.vulnerabilities ?? "unavailable");
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable
            }));
          }
          NODE
      - name: Type-check
        run: npm run lint
      - name: Run unit and validation tests
        run: npm test
      - name: Build application
        run: npm run build

  dependency-maintenance:
    # Only trusted pushes to main may update the lockfile. Pull requests never
    # receive a write-capable token or execute this maintenance job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Apply semver-compatible security fixes
        run: |
          set +e
          npm audit fix
          audit_exit=$?
          set -e

          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: remediate compatible dependency advisories"
            # Rebase onto any main commits that landed while npm audit ran.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No semver-compatible dependency changes were required."
          fi

          if [ "$audit_exit" -ne 0 ]; then
            echo "Some advisories may require a manual major-version upgrade."
          fi
